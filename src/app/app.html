<!-- Animated Background Orbs -->
<div class="orb-container">
  <div class="orb orb-primary"></div>
  <div class="orb orb-secondary"></div>
  <div class="orb orb-cyan"></div>
  <div class="orb orb-accent"></div>
</div>

<!-- Custom Fluid Glowing Cursor & Command Palette -->
<app-custom-cursor></app-custom-cursor>
<app-command-palette #palette></app-command-palette>

<!-- Header Navigation -->
<app-navbar (openPalette)="palette.open()"></app-navbar>

<!-- Main Sections -->
<main>
  <app-hero id="hero"></app-hero>
  <app-about id="about"></app-about>
  <app-skills id="skills"></app-skills>
  <app-projects id="projects"></app-projects>
  <app-experience id="experience"></app-experience>
  <app-education id="education"></app-education>
  <app-services id="services"></app-services>
  <app-contact id="contact"></app-contact>
</main>

<!-- Footer -->
<app-footer></app-footer>
